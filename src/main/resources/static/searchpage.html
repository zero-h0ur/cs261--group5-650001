<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TUEvent</title>
    <link rel="icon" type="image/x-icon" href="Resourse/TUevent-Logo.png" />
    <link rel="stylesheet" href="css/searchpage.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
</head>

<body>
	<script>
			window.addEventListener("pageshow", function (event) {
			  if (event.persisted) {
			    window.location.reload();
			  }
			});
	</script>
    <header></header>
    <nav class="navbar">
    <div class="navdiv">
      <div class="logo"><a href="index.html">TU EVENT</a></div>
      <ul>
        <li class="navbutton"><a href="index.html"><img src="Resourse/icon/home.png">หน้าหลัก</a></li>
        <li class="navbutton">
          <a href="searchpage.html?scroll=Content"><img src="Resourse/icon/event.png">อีเว้นท์</a>
        </li>
        <li class="navbutton">
          <a href="favorite-page.html"><img src="Resourse/icon/fav-button-active.png">รายการที่สนใจ</a>
        </li>
        <li class="navbutton" id="organizer_button">
          <a href="#"><img src="Resourse/icon/organize-button.png"><i class="material-icons">keyboard_arrow_down</i></a>
          <ul class="dropdown">
            <a>สำหรับผู้จัด</a>
            <div class="dropdown_item">
              <li><a href="#">สร้างกิจกรรม</a></li>
            </div>
          </ul>
        </li>
      </ul>
      <button class="Login_button"><img src="Resourse/icon/person.png"><a href="#">เข้าสู่ระบบ</a><i
          class="material-icons">keyboard_arrow_down</i></button>
    </div>
  </nav>
    <!-- Searchbar -->
    <div class="Searchblock">
        <img src="Resourse/Header.png" alt="TUEVENT" class="search-page-background-top" />
        <div>
            <form class="search-page-searchbar" action="searchpage.html" method="get">
                <div class="searchbar-rectangle"></div>
                <img src="Resourse/icon/Icon_Search.png" alt="search" class="icon-search" />
                <input type="text" class="search-input" name="q" placeholder="พิมพ์คำค้นหา..." />
                <button class="search-button" type="submit" onclick="search()">ค้นหาเลย</button>
                <button type="button" class="reset-button" onclick="resetSearch()"><img src="Resourse/icon/close.png"
                        alt="x-icon"></button>
            </form>
        </div>
        <img src="Resourse/png/Header-searchpage1.png" alt="Head" class="search-page-head" />
        <img src="Resourse/png/Header-searchpage2.png" alt="Questionmark" class="search-page-questionmark" />
    </div>

    <!-- Container -->
    <section>
        <div class="Container_content" id="Content">
            <div class="content-text">
                <div class="search-page-text">
                    <span class="search-page-text1">อีเว้นท์</span>
                    <span class="search-page-text2">ทั้งหมด</span>
                </div>
            </div>
            <div class="filterbar">
                <!-- Category Filter with Checkboxes -->
                <div class="Catagories">
                    <div class="category-dropdown-wrapper">
                        <div class="category-dropdown-button" onclick="toggleCategoryDropdown()">
                            <span class="category-selected-text">ทุกหมวดหมู่</span>
                            <i class="material-icons">keyboard_arrow_down</i>
                        </div>

                        <div class="category-dropdown-list" id="categoryDropdownList">
                            <div class="category-header">
                                <span>ประเภทอีเว้นท์</span>
                                <button class="category-clear-btn" onclick="clearAllCategories()">ล้าง</button>
                            </div>

                            <div class="category-options">
                                <!-- ทั้งหมด -->
                                <label class="category-checkbox-item">
                                    <input type="checkbox" value="all" onchange="handleCategoryChange(this)" checked>
                                    <span class="checkmark"></span>
                                    <span class="category-label">ทั้งหมด</span>
                                </label>

                                <!-- ค่าย -->
                                <label class="category-checkbox-item">
                                    <input type="checkbox" value="camp" onchange="handleCategoryChange(this)">
                                    <span class="checkmark"></span>
                                    <span class="category-label">ค่าย</span>
                                </label>

                                <!-- กิจกรรม -->
                                <label class="category-checkbox-item">
                                    <input type="checkbox" value="activity" onchange="handleCategoryChange(this)">
                                    <span class="checkmark"></span>
                                    <span class="category-label">กิจกรรม</span>
                                </label>

                                <!-- ดนตรี -->
                                <label class="category-checkbox-item">
                                    <input type="checkbox" value="music" onchange="handleCategoryChange(this)">
                                    <span class="checkmark"></span>
                                    <span class="category-label">ดนตรี</span>
                                </label>

                                <!-- เทคโนโลยี -->
                                <label class="category-checkbox-item">
                                    <input type="checkbox" value="technology" onchange="handleCategoryChange(this)">
                                    <span class="checkmark"></span>
                                    <span class="category-label">เทคโนโลยี</span>
                                </label>

                                <!-- กีฬา -->
                                <label class="category-checkbox-item">
                                    <input type="checkbox" value="sport" onchange="handleCategoryChange(this)">
                                    <span class="checkmark"></span>
                                    <span class="category-label">กีฬา</span>
                                </label>

                                <!-- แข่งขัน -->
                                <label class="category-checkbox-item">
                                    <input type="checkbox" value="competition" onchange="handleCategoryChange(this)">
                                    <span class="checkmark"></span>
                                    <span class="category-label">แข่งขัน</span>
                                </label>

                                <!-- เวิร์คชอป -->
                                <label class="category-checkbox-item">
                                    <input type="checkbox" value="workshop" onchange="handleCategoryChange(this)">
                                    <span class="checkmark"></span>
                                    <span class="category-label">เวิร์คชอป</span>
                                </label>

                                <!-- ศิลปะ -->
                                <label class="category-checkbox-item">
                                    <input type="checkbox" value="art" onchange="handleCategoryChange(this)">
                                    <span class="checkmark"></span>
                                    <span class="category-label">ศิลปะ</span>
                                </label>

                                <!-- วิชาการ -->
                                <label class="category-checkbox-item">
                                    <input type="checkbox" value="academic" onchange="handleCategoryChange(this)">
                                    <span class="checkmark"></span>
                                    <span class="category-label">วิชาการ</span>
                                </label>

                                <!-- การเงิน -->
                                <label class="category-checkbox-item">
                                    <input type="checkbox" value="finance" onchange="handleCategoryChange(this)">
                                    <span class="checkmark"></span>
                                    <span class="category-label">การเงิน</span>
                                </label>

                                <!-- ธุรกิจ -->
                                <label class="category-checkbox-item">
                                    <input type="checkbox" value="business" onchange="handleCategoryChange(this)">
                                    <span class="checkmark"></span>
                                    <span class="category-label">ธุรกิจ</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Filter dropdown (เก็บไว้เหมือนเดิม) -->
                <div class="filter-dropdown-wrapper">
                    <div class="Container_filter">
                        <div class="filter-dropdown-button" onclick="toggleFilterDropdown()">
                            <img src="Resourse/icon/filter.png" alt="filter" class="icon-filter" />
                            <span class="filter-dropdown-text">ทั้งหมด</span>
                            <i class="material-icons" alt="dropdown arrow">keyboard_arrow_down</i>
                        </div>

                        <div class="filter-dropdown-list" id="filterDropdownList">
                            <div class="filter-dropdown-option" onclick="selectFilter(event, 'ทั้งหมด')">
                                <span>ทั้งหมด</span>
                            </div>
                            <div class="filter-dropdown-option" onclick="selectFilter(event, 'วันนี้')">
                                <span>วันนี้</span>
                            </div>
                            <div class="filter-dropdown-option" onclick="selectFilter(event, 'สัปดาห์นี้')">
                                <span>สัปดาห์นี้</span>
                            </div>
                            <div class="filter-dropdown-option" onclick="selectFilter(event, 'เดือนนี้')">
                                <span>เดือนนี้</span>
                            </div>
                            <div class="filter-dropdown-option" onclick="selectFilter(event, 'กำหนดเอง')">
                                <span>กำหนดเอง</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Date picker (ยังไม่ผูก API) -->
            <div class="date-picker-container" id="ew-date-range">
                <form id="dateRangeForm" class="ew-date-search" onsubmit="event.preventDefault(); applyDateRange();">
                    <div class="ew-date-mode">
                        <label class="ew-label" id="Mode">โหมด</label>
                        <select id="rangeMode" class="ew-input" style="width:150px;">
                            <option value="single">วันเดียว</option>
                            <option value="range">ช่วงวัน/เวลา</option>
                        </select>
                    </div>

                    <div class="ew-date-group">
                        <label class="ew-label">ตั้งแต่วันที่</label>
                        <div class="ew-datebox">
                            <input id="ew-start-date" type="date" class="ew-input" />
                            
                        </div>
                    </div>

                    <div class="ew-date-group">
                        <label class="ew-label">ถึงวันที่</label>
                        <div class="ew-datebox">
                            <input id="ew-end-date" type="date" class="ew-input" />
                        
                        </div>
                    </div>

                    <div class="ew-actions">
                        <button type="submit" class="ew-btn">ตกลง</button>
                        <button type="button" class="ew-btn-clear" onclick="clearDateRange()">ล้าง</button>
                    </div>
                </form>
                <div id="dateStatus"
                    style="text-align:center;margin-top:8px;font-family:'Pridi';font-size:15px;color:#555;">
                </div>
            </div>

            <!-- Poster อีเว้นท์ -->
            <div id="results" class="Poster_container">
                <p id="emptyState" style="display:none; text-align:center; color:#999; margin:40px 0;">
                </p>
                <div id="resultList" class="Poster"></div>
            </div>

            <!-- Selectpage -->
            <div id="searchPager" class="Selectpage"></div>
            <div id="searchPageInfo" class="page-info"></div>
        </div>
    </section>

    <footer>
        <img class="Footer-img" src="Resourse/Footer.png" alt="Footer" />
        <img class="Footer-tape" src="Resourse/png/Footer-tape.png" alt="Footertape" />
    </footer>
	
	
	<script src="favorites.js" defer></script>
    <script src="searchpage.js" defer></script>
    <script src="category-filter.js"></script>
    <script src="search.js"></script>
	
</body>

</html>
