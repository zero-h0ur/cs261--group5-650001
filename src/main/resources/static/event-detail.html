<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TUEvent</title>
  <link rel="icon" type="image/x-icon" href="Resourse/TUevent-Logo.png" />
  <link rel="stylesheet" href="css/event-detail.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
</head>

<body>

  <header></header>
  <nav class="navbar">
    <div class="navdiv">
      <div class="logo"><a href="index.html">TU EVENT</a></div>
      <ul>
        <li class="navbutton"><a href="index.html">หน้าหลัก</a></li>
        <li class="navbutton">
          <a href="searchpage.html?scroll=Content">อีเว้นท์</a>
        </li>
        <li class="navbutton" id="organizer_button">
          <a href="#"><img src="Resourse/icon/organize-button.png"><i class="material-icons">keyboard_arrow_down</i></a>
          <ul class="dropdown">
            <a>สำหรับผู้จัด</a>
            <div class="dropdown_item">
              <li><a href="#">สร้างกิจกรรม</a></li>
            </div>
          </ul>
        </li>
      </ul>
      <button class="Login_button"><img src="Resourse/icon/person.png"><a href="#">เข้าสู่ระบบ</a><i
          class="material-icons">keyboard_arrow_down</i></button>
    </div>
  </nav>


  <section>
    <div class="container1">
      <div class="poster">

        <img id="evt-poster" src="Resourse/Poster/image 14.png" alt="Poster" />
      </div>
      <button class="button_reg"><a href="#" id="evt-register-link">ลงทะเบียน</a></button>
      <div class="bookmark-btn"><img src="Resourse/icon/fav-button-red.png" class="bookmark-icon"></div>
    </div>

    <div class="container2">
      <div class="detail">
        <div id="edAlert" style="display:none;margin-bottom:16px;"></div>
        <h1 id="evt-title">ชื่ออีเว้นท์</h1>
        <div class="catagories">
          <span id="evt-category-chip" class="pill">หมวดหมู่</span>
        </div>
        <p><i class="material-icons">calendar_month</i>
          <span id="evt-dates">-</span>
        </p>

        <p><i class="material-icons">schedule</i>
          <span id="evt-time">-</span>
        </p>

        <p><i class="material-icons">place</i>
          <span id="evt-location">-</span>
        </p>

        <div class="box_members">
          <h2>จำนวนผู้ลงทะเบียน</h2>
          <div class="box_members_num">
            <p><i class="material-icons">person</i>
              <span id="evt-capacity">-</span>
            </p>
          </div>
        </div>

        <div class="box_organizes">
          <h1>ผู้จัด</h1>
          <p id="evt-organizer">-</p>
        </div>

        <div class="box_details">
          <h1>รายละเอียด</h1>
          <p id="evt-detail">-</p>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <img class="Footer-img" src="Resourse/Footer.png" alt="Footer" />
    <img class="Footer-tape" src="Resourse/png/Footer-tape.png" alt="Footertape" />
  </footer>

  <script src="event-detail.js"></script>
</body>

</html>
