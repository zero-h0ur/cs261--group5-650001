<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TUEvent</title>
    <link rel="icon" type="image/x-icon" href="Resourse/TUevent-Logo.png" />
    <link rel="stylesheet" href="css/favorite-page.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
</head>

<body>
    <header></header>
    <nav class="navbar">
    <div class="navdiv">
      <div class="logo"><a href="index.html">TU EVENT</a></div>
      <ul>
        <li class="navbutton"><a href="index.html"><img src="Resourse/icon/home.png">หน้าหลัก</a></li>
        <li class="navbutton">
          <a href="searchpage.html?scroll=Content"><img src="Resourse/icon/event.png">อีเว้นท์</a>
        </li>
        <li class="navbutton">
          <a href="favorite-page.html"><img src="Resourse/icon/fav-button-active.png">รายการที่สนใจ</a>
        </li>
        <li class="navbutton" id="organizer_button">
          <a href="#"><img src="Resourse/icon/organize-button.png"><i class="material-icons">keyboard_arrow_down</i></a>
          <ul class="dropdown">
            <a>สำหรับผู้จัด</a>
            <div class="dropdown_item">
              <li><a href="#">สร้างกิจกรรม</a></li>
            </div>
          </ul>
        </li>
      </ul>
      <button class="Login_button"><img src="Resourse/icon/person.png"><a href="#">เข้าสู่ระบบ</a><i
          class="material-icons">keyboard_arrow_down</i></button>
    </div>
  </nav>
    <!-- Searchbar -->
    <div class="Searchblock">
        <img src="Resourse/Header.png" alt="TUEVENT" class="search-page-background-top" />
        <div>
            
        <img src="Resourse/png/72ea16dab273233f5ea7acc7abbec3c5-removebg-preview.png" alt="cat-rainbow" class="cat-rainbow" />
        <img src="Resourse/png/4515dd87cdf923fa74d71d7ef290b879-removebg-preview.png" alt="book" class="book" />
    </div>

    <!-- Container -->
    <section>
        <div class="Container_content" id="Content">
            <div class="content-text">
                <div class="search-page-text">
                    <img src="Resourse/icon/favorite (2).png" alt="favorite" class="favorite" />
                    <span class="search-page-text1">รายการ</span>
                    <span class="search-page-text2">สนใจ</span>
                </div>
            </div>
                <!-- Filter dropdown (เก็บไว้เหมือนเดิม) -->
                <div class="filter-dropdown-wrapper">
                    <div class="Container_filter">
                        <div class="filter-dropdown-button" onclick="toggleFilterDropdown()">
                            <img src="Resourse/icon/filter.png" alt="filter" class="icon-filter" />
                            <span class="filter-dropdown-text">ทั้งหมด</span>
                            <i class="material-icons" alt="dropdown arrow">keyboard_arrow_down</i>
                        </div>

                        <div class="filter-dropdown-list" id="filterDropdownList">
                            <div class="filter-dropdown-option" onclick="selectFilter(event, 'ทั้งหมด')">
                                <span>ทั้งหมด</span>
                            </div>
                            <div class="filter-dropdown-option" onclick="selectFilter(event, 'ตัวอักษร')">
                                <span>ตัวอักษร</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


            <!-- Poster อีเว้นท์ -->
            <div id="results" class="Poster_container">
                <p id="emptyState" style="display:none; text-align:center; color:#999; margin:40px 0;">
                </p>
                <div id="resultList" class="Poster"></div>
            </div>

            <!-- Selectpage -->
            <div id="searchPager" class="Selectpage"></div>
            <div id="searchPageInfo" class="page-info"></div>
        </div>
    </section>

    <footer>
        <img class="Footer-img" src="Resourse/Footer.png" alt="Footer" />
        <img class="Footer-tape" src="Resourse/png/Footer-tape.png" alt="Footertape" />
    </footer>

    <script>
    window.addEventListener("pageshow", function (event) {
      if (event.persisted) {
        window.location.reload();
      }
    });
  </script>
    <script src="favorites.js" defer></script>
    <script src="favorite-page.js" defer></script>
    <script src="category-filter.js"></script>
    <script src="search.js"></script>
</body>

</html>
